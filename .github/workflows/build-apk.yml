name: Build NET GUARD APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NET_GUARD_Android_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q NET_GUARD_Android_Project.zip -d project

      - name: Build APK
        run: gradle -p project/NET_GUARD_Android assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: NET-GUARD-APK
          path: project/NET_GUARD_Android/app/build/outputs/apk/debug/app-debug.apk
